<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>功能蓝图 · 独立组件</title>
<link rel="stylesheet" href="style.css">
<style>
    body { margin: 0; padding: 24px; font: 14px/1.5 system-ui; color: #253047; background: #f5f7fa; }
    h1 { font-size: 22px; font-weight: 500; margin: 0; }
    p { color: #61708a; }
    #app { max-width: 1100px; border-radius: 12px; background: white; }
    @media (prefers-color-scheme: dark) {
        body { color: #e3e8f0; background: #151a22; }
        p { color: #a4afbf; } #app { background: #202735; --text-main: #e3e8f0; --text-muted: #a4afbf; --accent-color: #8eb8ff; }
    }
</style>
<h1>功能蓝图</h1>
<p>切换列表与思维导图，选择模块后添加子模块或功能点。拖拽节点调整层级，点击蓝图中心回到一级目录。</p>
<div id="app"></div>
<script type="module" src="demo.js"></script>
</html>
