name: Publish npm
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e 'if (process.env.GITHUB_REF_NAME !== "v" + require("./package.json").version) process.exit(1)'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm pack --dry-run
      - name: Publish unified CLI and DSH package
        run: npm publish --access public --provenance --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
